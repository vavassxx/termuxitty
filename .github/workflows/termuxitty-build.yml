name: Termuxitty build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: termuxitty-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [apt-android-7, apt-android-5]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build signed debug APKs
        env:
          TERMUX_PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: ./gradlew assembleDebug

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/debug"
          shopt -s nullglob
          apks=("$APK_DIR"/*.apk)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            echo "Verifying $apk"
            apksigner verify --verbose "$apk"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: termuxitty-debug-${{ matrix.package_variant }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
